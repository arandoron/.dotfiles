set $laptop_screen "eDP-1"
set $external_monitor "DP-1"

# reassign workspaces after variables are set
# loading the config doesn't wait for interpreting included files before it continues interpreting
# the main config, which results in the workspaces already already assigned to the default displays
workspace $ws1 output $external_monitor
workspace $ws2 output $external_monitor
workspace $ws3 output $external_monitor
workspace $ws4 output $external_monitor
workspace $ws5 output $external_monitor
workspace $ws6 output $laptop_screen
workspace $ws7 output $laptop_screen
workspace $ws8 output $laptop_screen
workspace $ws9 output $laptop_screen
workspace $ws10 output $laptop_screen
